<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Progress tracker visual</title>
  <desc id="desc">A visual representation of the completed progress tracker with every day marked Lesson Completed.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="80" y="56" width="800" height="428" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="112" y="104" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Progress Tracker</text>
  <text x="112" y="137" fill="#475569" font-family="Arial, sans-serif" font-size="17">Current Progress: 45 / 45 Days Completed</text>
  <g transform="translate(112 178)">
    <rect width="736" height="44" rx="8" fill="#0f172a"/>
    <text x="24" y="28" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Day</text>
    <text x="104" y="28" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Topic</text>
    <text x="536" y="28" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Status</text>
    <g font-family="Arial, sans-serif" font-size="14">
      <rect y="58" width="736" height="34" rx="6" fill="#f1f5f9"/>
      <text x="24" y="80" fill="#334155">1</text>
      <text x="104" y="80" fill="#334155">IT Help Desk Foundation</text>
      <text x="536" y="80" fill="#15803d" font-weight="700">Lesson Completed</text>
      <rect y="106" width="736" height="34" rx="6" fill="#ffffff"/>
      <text x="24" y="128" fill="#334155">15</text>
      <text x="104" y="128" fill="#334155">Network Commands</text>
      <text x="536" y="128" fill="#15803d" font-weight="700">Lesson Completed</text>
      <rect y="154" width="736" height="34" rx="6" fill="#f1f5f9"/>
      <text x="24" y="176" fill="#334155">30</text>
      <text x="104" y="176" fill="#334155">Backup and Recovery</text>
      <text x="536" y="176" fill="#15803d" font-weight="700">Lesson Completed</text>
      <rect y="202" width="736" height="34" rx="6" fill="#ffffff"/>
      <text x="24" y="224" fill="#334155">45</text>
      <text x="104" y="224" fill="#334155">Final Assessment and Career Readiness</text>
      <text x="536" y="224" fill="#15803d" font-weight="700">Lesson Completed</text>
    </g>
  </g>
  <rect x="112" y="438" width="736" height="14" rx="7" fill="#16a34a"/>
  <text x="414" y="470" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">100% Complete</text>
</svg>
