    <text x="184" y="365">Documentation Examples</text>
    <text x="538" y="365">Ticket Note Examples</text>
  </g>
  <rect x="160" y="421" width="640" height="36" rx="8" fill="#eff6ff"/>
  <text x="184" y="445" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Key takeaways captured for every completed day</text>
</svg>
