  <rect x="120" y="48" width="720" height="444" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="160" y="98" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Day XX - Daily Learning Log</text>
  <rect x="160" y="122" width="210" height="32" rx="16" fill="#dcfce7"/>
  <text x="182" y="144" fill="#166534" font-family="Arial, sans-serif" font-size="15" font-weight="700">Status: Lesson Completed</text>
  <g fill="#f1f5f9" stroke="#e2e8f0">
    <rect x="160" y="184" width="286" height="54" rx="10"/>
    <rect x="514" y="184" width="286" height="54" rx="10"/>
    <rect x="160" y="258" width="286" height="54" rx="10"/>
    <rect x="514" y="258" width="286" height="54" rx="10"/>
